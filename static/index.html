<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AllinOne Downloader</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f6f5f2; --surface: #ffffff; --ink: #18181b; --muted: #6b6b73;
    --line: #e4e2dc; --accent: #e5484d; --accent-ink: #fff; --ok: #2f9e66;
    --shadow: 0 1px 2px rgba(0,0,0,.04), 0 8px 24px rgba(0,0,0,.06);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #111113; --surface: #1a1a1d; --ink: #ededef; --muted: #9b9ba3;
      --line: #2a2a2f; --accent: #f2555a; --shadow: 0 8px 24px rgba(0,0,0,.4);
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; background: var(--bg); color: var(--ink);
    font: 16px/1.5 Inter, system-ui, sans-serif;
    display: flex; flex-direction: column; align-items: center; padding: 64px 16px 32px;
  }
  main { width: 100%; max-width: 640px; }
  h1 { font-size: clamp(28px, 6vw, 40px); letter-spacing: -.02em; margin: 0 0 8px; }
  .sub { color: var(--muted); margin: 0 0 32px; }
  .chips { display: flex; gap: 8px; margin-bottom: 16px; }
  .chip { font-size: 13px; padding: 4px 10px; border: 1px solid var(--line); border-radius: 999px; color: var(--muted); }

  form { display: flex; gap: 8px; background: var(--surface); border: 1px solid var(--line);
         border-radius: 14px; padding: 6px; box-shadow: var(--shadow); }
  input[type=url] { flex: 1; min-width: 0; border: 0; background: transparent; color: var(--ink);
                    font: inherit; padding: 12px 12px; outline: none; }
  button { font: inherit; font-weight: 600; border: 0; border-radius: 10px; cursor: pointer;
           padding: 12px 18px; background: var(--accent); color: var(--accent-ink); white-space: nowrap; }
  button:disabled { opacity: .55; cursor: default; }
  .ghost { background: transparent; color: var(--muted); padding: 12px; }

  .msg { margin-top: 16px; font-size: 14px; color: var(--accent); min-height: 1.5em; }
  .card { margin-top: 24px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px;
          overflow: hidden; box-shadow: var(--shadow); display: none; }
  .card.show { display: block; }
  .media { display: flex; gap: 16px; padding: 16px; }
  .thumb { width: 160px; aspect-ratio: 16/9; object-fit: cover; border-radius: 8px; background: var(--line); flex-shrink: 0; }
  .meta { min-width: 0; }
  .meta h2 { font-size: 17px; margin: 0 0 4px; line-height: 1.35;
             display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .meta p { margin: 0; color: var(--muted); font-size: 14px; }
  .opts { border-top: 1px solid var(--line); padding: 16px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .q { background: transparent; color: var(--ink); border: 1px solid var(--line); padding: 8px 14px; font-weight: 500; }
  .q[aria-pressed=true] { border-color: var(--ink); background: var(--ink); color: var(--surface); }
  .opts .go { margin-left: auto; }

  .progress { padding: 0 16px 16px; display: none; }
  .progress.show { display: block; }
  .bar { height: 8px; background: var(--line); border-radius: 99px; overflow: hidden; }
  .bar > i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .3s; }
  .bar.indet > i { width: 30%; animation: slide 1.2s infinite ease-in-out; }
  @keyframes slide { from { margin-left: -30%; } to { margin-left: 100%; } }
  .stat { display: flex; justify-content: space-between; font-size: 13px; color: var(--muted); margin-top: 8px; }
  .done { color: var(--ok); font-weight: 600; }

  footer { margin-top: auto; padding-top: 48px; font-size: 12px; color: var(--muted); text-align: center; max-width: 520px; }

  @media (max-width: 520px) {
    body { padding-top: 40px; }
    form { flex-direction: column; }
    .media { flex-direction: column; }
    .thumb { width: 100%; }
    .opts .go { margin-left: 0; width: 100%; }
  }
</style>
</head>
<body>
<main>
  <div class="chips"><span class="chip">YouTube</span><span class="chip">Shorts</span><span class="chip">Instagram Reels &amp; Posts</span></div>
  <h1>Paste a link. Get the video.</h1>
  <p class="sub">Works with YouTube videos, Shorts and public Instagram reels/posts. MP4 or MP3.</p>

  <form id="form">
    <input id="url" type="url" placeholder="https://www.youtube.com/watch?v=…  or  https://www.instagram.com/reel/…" required autocomplete="off">
    <button type="button" class="ghost" id="paste" title="Paste from clipboard">Paste</button>
    <button id="fetch" type="submit">Fetch</button>
  </form>
  <div class="msg" id="msg" role="status"></div>

  <section class="card" id="card">
    <div class="media">
      <img class="thumb" id="thumb" alt="" referrerpolicy="no-referrer">
      <div class="meta">
        <h2 id="title"></h2>
        <p id="byline"></p>
      </div>
    </div>
    <div class="opts" id="opts"></div>
    <div class="progress" id="progress">
      <div class="bar" id="bar"><i></i></div>
      <div class="stat"><span id="pstatus">Starting…</span><span id="pinfo"></span></div>
    </div>
  </section>
</main>
<footer>Only download videos you own or have permission to save. Respect creators and each platform's terms.</footer>

<script>
const $ = id => document.getElementById(id);
let current = null, quality = "best", polling = null;

const label = q => ({ best: "Best", audio: "MP3 audio" }[q] || q + "p");
const fmtTime = s => s == null ? "" : `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, "0")}`;
const fmtSpeed = b => !b ? "" : b > 1048576 ? (b / 1048576).toFixed(1) + " MB/s" : (b / 1024).toFixed(0) + " KB/s";

function setMsg(t) { $("msg").textContent = t || ""; }

$("paste").onclick = async () => {
  try { $("url").value = (await navigator.clipboard.readText()).trim(); $("url").focus(); }
  catch { setMsg("Clipboard access was blocked — paste with Ctrl+V."); }
};

$("form").onsubmit = async e => {
  e.preventDefault();
  setMsg(""); $("card").classList.remove("show"); clearInterval(polling);
  const url = $("url").value.trim();
  $("fetch").disabled = true; $("fetch").textContent = "Fetching…";
  try {
    const r = await fetch("/api/info", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ url }) });
    const d = await r.json();
    if (!r.ok) throw new Error(d.error);
    current = { url, ...d };
    render();
  } catch (err) { setMsg(err.message || "Something went wrong."); }
  finally { $("fetch").disabled = false; $("fetch").textContent = "Fetch"; }
};

function render() {
  $("thumb").src = current.thumbnail || "";
  $("title").textContent = current.title;
  $("byline").textContent = [current.platform === "youtube" ? "YouTube" : "Instagram", current.uploader, fmtTime(current.duration)].filter(Boolean).join(" · ");
  quality = current.qualities[0];
  const opts = $("opts"); opts.innerHTML = "";
  current.qualities.forEach(q => {
    const b = document.createElement("button");
    b.className = "q"; b.type = "button"; b.textContent = label(q);
    b.setAttribute("aria-pressed", q === quality);
    b.onclick = () => { quality = q; opts.querySelectorAll(".q").forEach(x => x.setAttribute("aria-pressed", x === b)); };
    opts.appendChild(b);
  });
  const go = document.createElement("button");
  go.className = "go"; go.type = "button"; go.id = "go"; go.textContent = "Download";
  go.onclick = startDownload;
  opts.appendChild(go);
  $("progress").classList.remove("show");
  $("card").classList.add("show");
}

async function startDownload() {
  setMsg("");
  $("go").disabled = true;
  $("progress").classList.add("show");
  setProgress(0, "Starting…", "");
  try {
    const r = await fetch("/api/download", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ url: current.url, quality }) });
    const d = await r.json();
    if (!r.ok) throw new Error(d.error);
    poll(d.job_id);
  } catch (err) { fail(err.message); }
}

function poll(id) {
  polling = setInterval(async () => {
    try {
      const d = await (await fetch(`/api/progress/${id}`)).json();
      if (d.status === "error") { clearInterval(polling); return fail(d.error); }
      if (d.status === "downloading") setProgress(d.percent, `Downloading ${d.percent.toFixed(0)}%`, [fmtSpeed(d.speed), d.eta != null ? fmtTime(d.eta) + " left" : ""].filter(Boolean).join(" · "));
      if (d.status === "processing") setProgress(null, "Merging & converting…", "");
      if (d.status === "done") {
        clearInterval(polling);
        setProgress(100, "", "");
        $("pstatus").innerHTML = `<span class="done">Ready — saving ${d.filename.replace(/[<>&]/g, "")}</span>`;
        window.location.href = `/api/file/${id}`;
        $("go").disabled = false;
      }
    } catch (err) { clearInterval(polling); fail("Lost connection to the server."); }
  }, 700);
}

function setProgress(pct, status, info) {
  $("bar").classList.toggle("indet", pct == null);
  $("bar").firstElementChild.style.width = pct == null ? "" : pct + "%";
  $("pstatus").textContent = status; $("pinfo").textContent = info;
}

function fail(m) { setMsg(m || "Download failed."); $("progress").classList.remove("show"); if ($("go")) $("go").disabled = false; }
</script>
</body>
</html>
